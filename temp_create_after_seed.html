<h1>Create Pokemon Card</h1>

<form method="post" class="entity-form" action="/karte/create">
    

    <div class="form-group">
        <label for="CardName">CardName</label>
        <input class="form-control" type="text" data-val="true" data-val-length="The field CardName must be a string with a maximum length of 150." data-val-length-max="150" data-val-required="The CardName field is required." id="CardName" maxlength="150" name="CardName" value="" />
        <span class="text-danger field-validation-valid" data-valmsg-for="CardName" data-valmsg-replace="true"></span>
    </div>

    <div class="form-row">
        <div class="form-group col-6">
            <label for="PokemonNumber">PokemonNumber</label>
            <input class="form-control" type="number" data-val="true" data-val-range="The field PokemonNumber must be between 1 and 9999." data-val-range-max="9999" data-val-range-min="1" data-val-required="The PokemonNumber field is required." id="PokemonNumber" name="PokemonNumber" value="0" /><input name="__Invariant" type="hidden" value="PokemonNumber" />
            <span class="text-danger field-validation-valid" data-valmsg-for="PokemonNumber" data-valmsg-replace="true"></span>
        </div>
        <div class="form-group col-6">
            <label for="Type">Type</label>
            <select class="form-control" data-val="true" data-val-required="The Type field is required." id="Type" name="Type"><option selected="selected" value="0">Colorless</option>
<option value="1">Fire</option>
<option value="2">Water</option>
<option value="3">Electric</option>
<option value="4">Grass</option>
<option value="5">Fighting</option>
<option value="6">Psychic</option>
<option value="7">Dragon</option>
<option value="8">Dark</option>
<option value="9">Steel</option>
<option value="10">Fairy</option>
</select>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group col-6">
            <label for="Rarity">Rarity</label>
            <select class="form-control" data-val="true" data-val-required="The Rarity field is required." id="Rarity" name="Rarity"><option selected="selected" value="0">Common</option>
<option value="1">Uncommon</option>
<option value="2">Rare</option>
<option value="3">UltraRare</option>
<option value="4">SecretRare</option>
<option value="5">Promo</option>
</select>
        </div>
        <div class="form-group col-6">
            <label for="MarketPrice">MarketPrice</label>
            <input class="form-control" type="text" data-val="true" data-val-number="The field MarketPrice must be a number." data-val-range="The field MarketPrice must be between 0 and 1000000." data-val-range-max="1000000" data-val-range-min="0" data-val-required="The MarketPrice field is required." id="MarketPrice" name="MarketPrice" value="0.00" />
            <span class="text-danger field-validation-valid" data-valmsg-for="MarketPrice" data-valmsg-replace="true"></span>
        </div>
    </div>

    <div class="form-group">
        <label>Card Set</label>
        
<div class="cardset-autocomplete-wrapper">
    <input type="hidden" name="CardSetId" value="0" class="cardset-id" />
    <input type="text" class="form-control cardset-autocomplete" value="" placeholder="Search card set..." autocomplete="off" />
    <div class="cardset-suggestions" style="display:none; position: absolute; background: white; z-index:1000; border: 1px solid #ddd; max-height:200px; overflow:auto;"></div>
</div>

    </div>

<div class="datetime-picker">

    <small class="form-text text-muted">Use format YYYY-MM-DD HH:mm (js helper provided)</small>
    <div class="datetime-popup" style="display:none; position:absolute; background:#fff; border:1px solid #ccc; padding:8px;"></div>
</div>
